repos:
  - repo: git@github.com:psf/black.git
    rev: 24.3.0
    hooks:
      - id: black
        args: [--line-length=150]

  - repo: git@github.com:pycqa/flake8.git
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ["--ignore=E203,E501,W503", "--max-line-length=150"]

  # 新增:执行 hello.py 的本地钩子
  - repo: local
    hooks:
      - id: run-code-checker
        name: Run Code Checker
        entry: python code_checker.py  # 指向你的检查脚本
        language: system
        pass_filenames: true  # 关键:传递本次提交的文件名给脚本
        types: [python]
        # This checker targets installable drivers; standalone experiments/PC fixtures use the regression check below.
        exclude: ^(code_checker\.py$|motor_drivers/bus_dc_motor_driver/(examples|tests)/)
      - id: bus-dc-regression
        name: Run BusDCMotor regression tests
        entry: python -m unittest discover -s motor_drivers/bus_dc_motor_driver/tests -p test_*.py
        language: system
        pass_filenames: false
        files: ^(code_checker\.py$|motor_drivers/bus_dc_motor_driver/.*\.py$)